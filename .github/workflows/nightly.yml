name: Nightly build

# Every push to main replaces the `nightly` prerelease with fresh installers.
#
# A rolling tag rather than a version tag: the project is pre-1.0 and every commit on main is
# the newest thing there is, so pinning a version per push would produce a wall of meaningless
# releases. Once there are real versions, this becomes a `v*` tag trigger instead.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One build at a time. Two pushes in quick succession would otherwise race to recreate the same
# release and one would upload into a release the other had just deleted.
concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    name: Recreate the nightly release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      # Deleting first is what keeps assets from previous runs from piling up under the same
      # tag — tauri-action uploads but never cleans.
      - name: Delete the previous nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete nightly --cleanup-tag --yes || true

      - name: Create the release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Every call here is retried. A single transient 503 from the GitHub API took down a
          # whole nightly once — the release was never created, so all three platform builds
          # were skipped, over a hiccup that had nothing to do with the code.
          retry() {
            local attempt delay=5
            for attempt in 1 2 3 4 5; do
              if "$@"; then
                return 0
              fi
              echo "attempt $attempt failed, retrying in ${delay}s" >&2
              sleep "$delay"
              delay=$(( delay * 2 ))
            done
            echo "gave up after 5 attempts: $*" >&2
            return 1
          }

          short="${GITHUB_SHA:0:7}"
          {
            printf 'Built from [`%s`](https://github.com/%s/commit/%s) on `main`.\n\n' \
              "$short" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            cat .github/release-notes/nightly.md
          } > notes.md

          # Idempotent, so a retry after a half-succeeded call does not fail with
          # "release already exists" and mask the original error.
          create_release() {
            if gh release view nightly >/dev/null 2>&1; then
              return 0
            fi
            gh release create nightly \
              --target "$GITHUB_SHA" \
              --title "Nightly build ($short)" \
              --prerelease \
              --notes-file notes.md
          }
          retry create_release

          # Handed to tauri-action so it uploads into this release instead of trying to
          # create its own — three matrix jobs racing to create one release ends badly.
          read_release_id() {
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/nightly" --jq .id > release_id.txt
          }
          retry read_release_id
          echo "release_id=$(cat release_id.txt)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: prepare
    strategy:
      # One platform failing should not deny the other two their installers.
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            args: ""
          - name: macOS (universal)
            runner: macos-latest
            args: "--target universal-apple-darwin"
          - name: Linux
            runner: ubuntu-latest
            args: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # A universal macOS binary needs both architectures; the field is ignored elsewhere.
          targets: ${{ matrix.runner == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # The bundlers fetch their own tooling on every run — WiX and NSIS on Windows, the
      # AppImage toolchain on Linux — and a Linux build failed with `http status: 429` when
      # GitHub rate-limited those downloads. Caching them removes the downloads, and with them
      # most of the exposure. It does not eliminate it: a cold cache still has to fetch once.
      - name: Cache bundler tooling
        uses: actions/cache@v4
        with:
          # Both paths listed because the location differs by platform; a missing one is
          # simply skipped.
          path: |
            ~/.cache/tauri
            ~/AppData/Local/tauri
          key: tauri-bundler-tools-${{ matrix.runner }}-v1

      - name: Install Linux dependencies
        if: matrix.runner == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: nightly
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }}

  # Android is a separate job rather than a matrix row: it needs a JDK, the NDK and four Rust
  # targets, and it produces its artifact through Gradle rather than through tauri-action.
  #
  # It exists because the release is deleted and recreated on every push, which quietly threw
  # away an APK that had been uploaded by hand. Anything that should be in a release has to be
  # built by the release.
  android:
    name: Android (arm64)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 21, not the newest available. The generated project uses Android Gradle Plugin 8.11,
      # which answers `Unsupported class file major version 69` to a Java 25 toolchain.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android

      - run: npm ci

      # The runner ships an NDK; Tauri wants to be told which one.
      - name: Point at the NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      # Linux has no trouble with the symlink into jniLibs that fails on Windows, so the
      # ordinary command works here and the local workaround in docs/dev/android.md is not
      # needed. The APK is signed with Gradle's generated debug key, which is enough to install
      # but not to publish — a real signing key is still to come.
      - name: Build the APK
        run: npm run tauri -- android build --debug --target aarch64

      - name: Attach it to the nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk=$(find src-tauri/gen/android -name "*.apk" | head -1)
          test -n "$apk" || { echo "no APK was produced"; exit 1; }
          cp "$apk" "MagicOptimizer-arm64-debug.apk"
          gh release upload nightly "MagicOptimizer-arm64-debug.apk" --clobber
