name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The workspace includes src-tauri, which links against the system WebView. Without
      # these the whole job fails at link time rather than on anything to do with our code.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The catalog artifact is 26 MB and built from Scryfall rather than committed, so the
      # tests that need it skip here. Everything else runs.
      - name: Test
        run: cargo test --workspace

  # Invariant 1 in CLAUDE.md — no crate under `crates/` may pull in C or C++, because the
  # domain has to cross-compile to Android. `cargo check` does not link, so this needs the Rust
  # target but neither the SDK nor the NDK: it fails on a C dependency at build-script time,
  # which is exactly the violation worth catching. `src-tauri` and `tools/` are excluded on
  # purpose — the tool is the documented exception, and the shell needs a real Android setup.
  android:
    name: domain crates cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Check against aarch64-linux-android
        run: |
          cargo check --target aarch64-linux-android \
            -p mtg-core -p mtg-data -p mtg-collection -p mtg-deck \
            -p mtg-optimizer -p mtg-combo -p mtg-journal -p mtg-vision

  frontend:
    name: svelte-check, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npx vite build
