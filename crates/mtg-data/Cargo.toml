[package]
name = "mtg-data"
description = "Card catalog: zero-copy archive format, loading and search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
mtg-core = { path = "../mtg-core" }
rkyv = "0.8"
memmap2 = "0.9"
thiserror = "2"
# Pure Rust. Needed to fold accents when matching card names: someone typing "Lim-Dul" must
# find "Lim-Dûl's Vault", and a decklist exported by another tool may spell it either way.
unicode-normalization = "0.1"

[dev-dependencies]
clap = { version = "4", features = ["derive"] }
