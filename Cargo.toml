[workspace]
resolver = "2"
members = ["crates/mtg-core"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/eraflo/MagicOptimizer"
authors = ["eraflo"]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# The catalog and artifacts come from the network: never panic on them.
# See CLAUDE.md, "Conventions".
unwrap_used = "warn"
expect_used = "warn"
